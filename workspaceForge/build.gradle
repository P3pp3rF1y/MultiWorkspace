plugins {
    id 'idea'
    id "org.sonarqube" version "5.0.0.4638"
    id "maven-publish"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def workspaceGradleProperties = file('../workspace/gradle.properties')
if (workspaceGradleProperties.exists()) {
    def sharedProperties = new Properties()
    workspaceGradleProperties.withInputStream { sharedProperties.load(it) }
    sharedProperties.each { key, value ->
        project.ext.set(key.toString(), value)
    }
}

repositories {
    maven {
        url "https://maven.ftb.dev/releases"
        content {
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    // maven { url 'https://www.dogforce-games.com/maven/' }
    maven { // JEI
        url "https://dvs1.progwml6.com/files/maven"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
            includeGroup "vazkii.botania"
        }
    }
    maven { // Patchouli
        url "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
            includeGroup "vazkii.patchouli"
            includeGroup "vazkii.botania"
        }
    }
    // maven { // TOP
    //     url "https://maven.k-4u.nl"
    //     content {
    //         includeGroup "mcjty.theoneprobe"
    //     }
    // }
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroup "com.simibubi.create"
            includeGroupByRegex "net.createmod.*"
            includeGroupByRegex "dev.engine-room.*"
        }
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = "https://maven.twelveiterations.com/repository/maven-public/"
        content {
            includeGroup "net.blay09.mods"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "dev.architectury"
            includeGroup "me.shedaniel"
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven { url 'https://maven.su5ed.dev/releases' }
}

version = '1.0'
group = 'com.yourname.modid' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'modid'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment' , version: "$parchment_version"
//    accessTransformer = file('workspace/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            workingDirectory project.file("run/${it.name}")
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            ['sophisticatedstorageinmotion.mixins.json', 'sophisticatedcore.mixins.json'].each { mixinConfig ->
                if (file("src/main/resources/${mixinConfig}").exists()) {
                    args "--mixin", mixinConfig
                }
            }

            def siblingMods = [
                    [id: 'Reliquary', path: '../Reliquary'],
                    [id: 'SophisticatedCore', path: '../SophisticatedCore'],
                    [id: 'SophisticatedBackpacks', path: '../SophisticatedBackpacks'],
                    [id: 'SophisticatedBackpacksCreateIntegration', path: '../SophisticatedBackpacksCreateIntegration'],
                    [id: 'SophisticatedStorage', path: '../SophisticatedStorage'],
                    [id: 'SophisticatedStorageInMotion', path: '../SophisticatedStorageInMotion'],
                    [id: 'SophisticatedItemActions', path: '../SophisticatedItemActions'],
                    [id: 'SophisticatedInventoryInteractions', path: '../SophisticatedInventoryInteractions'],
                    [id: 'SophisticatedStorageCreateIntegration', path: '../SophisticatedStorageCreateIntegration']
            ]

            def modClassesEntries = []
            siblingMods.each { siblingMod ->
                def resourcesPath = file("${siblingMod.path}/build/resources/main")
                def classesPath = file("${siblingMod.path}/build/classes/java/main")
                if (resourcesPath.exists()) {
                    modClassesEntries << "${siblingMod.id}%%${resourcesPath.absolutePath}"
                }
                if (classesPath.exists()) {
                    modClassesEntries << "${siblingMod.id}%%${classesPath.absolutePath}"
                }
            }
            if (!modClassesEntries.isEmpty()) {
                environment 'MOD_CLASSES', modClassesEntries.join(';')
            }

            mods {
                if (findProject(':Reliquary') != null) {
                    Reliquary {
                        source project(':Reliquary').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedCore') != null) {
                    SophisticatedCore {
                        source project(':SophisticatedCore').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedBackpacks') != null) {
                    SophisticatedBackpacks {
                        source project(':SophisticatedBackpacks').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedBackpacksCreateIntegration') != null) {
                    SophisticatedBackpacksCreateIntegration {
                        source project(':SophisticatedBackpacksCreateIntegration').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedStorage') != null) {
                    SophisticatedStorage {
                        source project(':SophisticatedStorage').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedStorageInMotion') != null) {
                    SophisticatedStorageInMotion {
                        source project(':SophisticatedStorageInMotion').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedStorageCreateIntegration') != null) {
                    SophisticatedStorageCreateIntegration {
                        source project(':SophisticatedStorageCreateIntegration').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedItemActions') != null) {
                    SophisticatedItemActions {
                        source project(':SophisticatedItemActions').sourceSets.main
                    }
                }
                if (findProject(':SophisticatedInventoryInteractions') != null) {
                    SophisticatedInventoryInteractions {
                        source project(':SophisticatedInventoryInteractions').sourceSets.main
                    }
                }
            }
        }
        client {
        }

        client2 {
            args '--username', 'Dev2'
        }

        server {
        }

        data {
        }
    }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

file("$buildDir/resources/main").mkdirs()
file("$buildDir/classes/java/main").mkdirs()

tasks.matching { it.name in ['prepareRunClientCompile', 'prepareRunClient2Compile', 'prepareRunServerCompile', 'prepareRunDataCompile'] }.configureEach {
    dependsOn tasks.named('classes')
    [
            ':Reliquary',
            ':SophisticatedCore',
            ':SophisticatedBackpacks',
            ':SophisticatedBackpacksCreateIntegration',
            ':SophisticatedStorage',
            ':SophisticatedStorageInMotion',
            ':SophisticatedStorageCreateIntegration',
            ':SophisticatedItemActions',
            ':SophisticatedInventoryInteractions'
    ].each { siblingProjectPath ->
        if (findProject(siblingProjectPath) != null) {
            dependsOn "${siblingProjectPath}:classes"
        }
    }
    doFirst {
        file("$buildDir/resources/main").mkdirs()
        file("$buildDir/classes/java/main").mkdirs()
    }
}

tasks.matching { it.name in ['runClient', 'runClient2', 'runServer', 'runData'] }.configureEach {
    doFirst {
        file("$buildDir/resources/main").mkdirs()
        file("$buildDir/classes/java/main").mkdirs()
    }
}

