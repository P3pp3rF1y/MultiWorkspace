name: Mod Build (Reusable)

on:
  workflow_call:
    inputs:
      changelog_range:
        required: false
        type: string
        default: ""
      # ForgeGradle 6 can cache a malformed userdev download on hosted runners.
      # Projects that still use it may opt into a verified prefetch until they migrate.
      forge_userdev_version:
        required: false
        type: string
        default: ""
      forge_userdev_md5:
        required: false
        type: string
        default: ""

env:
  JAVA_VERSION: "17"

jobs:
  gate:
    name: Check Release Branch
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.check.outputs.branch_name }}
      should_publish_cf_mr: ${{ steps.check.outputs.should_publish_cf_mr }}
    steps:
      - id: check
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          
          if [[ "$BRANCH_NAME" =~ ^[0-9]+\.[0-9]+\.([0-9]+|x)$ ]]; then
            echo "should_publish_cf_mr=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish_cf_mr=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Mod
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      embed_title: ${{ steps.embed.outputs.EMBED_TITLE }}
      embed_url: ${{ steps.embed.outputs.EMBED_URL }}
      embed_author_name: ${{ steps.embed.outputs.EMBED_AUTHOR_NAME }}
      embed_author_icon_url: ${{ steps.embed.outputs.EMBED_AUTHOR_ICON_URL }}
      embed_description: ${{ steps.embed.outputs.EMBED_DESCRIPTION }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-jdk${{ env.JAVA_VERSION }}-wrapper${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-

      # Work around ForgeGradle 6 accepting and caching corrupt userdev downloads.
      - name: Verify legacy Forge userdev
        if: inputs.forge_userdev_version != ''
        env:
          FORGE_USERDEV_VERSION: ${{ inputs.forge_userdev_version }}
          FORGE_USERDEV_MD5: ${{ inputs.forge_userdev_md5 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FORGE_USERDEV_MD5" ]] || { echo "forge_userdev_md5 is required" >&2; exit 1; }

          userdev_file="forge-${FORGE_USERDEV_VERSION}-userdev.jar"
          cache_dir="$HOME/.gradle/caches/forge_gradle/maven_downloader/net/neoforged/forge/${FORGE_USERDEV_VERSION}"
          target="$cache_dir/$userdev_file"
          mkdir -p "$cache_dir"

          if [[ -f "$target" ]] && [[ "$(md5sum "$target" | awk '{print $1}')" == "$FORGE_USERDEV_MD5" ]] && unzip -tqq "$target"; then
            printf '%s' "$FORGE_USERDEV_MD5" > "$target.md5"
            exit 0
          fi

          temporary_file="$(mktemp "$cache_dir/.${userdev_file}.XXXXXX")"
          trap 'rm -f "$temporary_file"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --output "$temporary_file" \
            "https://maven.neoforged.net/releases/net/neoforged/forge/${FORGE_USERDEV_VERSION}/${userdev_file}"

          actual_md5="$(md5sum "$temporary_file" | awk '{print $1}')"
          [[ "$actual_md5" == "$FORGE_USERDEV_MD5" ]] || { echo "Downloaded userdev checksum does not match" >&2; exit 1; }
          unzip -tqq "$temporary_file"
          mv "$temporary_file" "$target"
          printf '%s' "$FORGE_USERDEV_MD5" > "$target.md5"

      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: ./gradlew build

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-libs
          path: |
            **/build/libs/*.jar
            **/build/classes/**
          retention-days: 7

      - name: Retrieve Version
        id: version
        run: |
          echo "VERSION_NAME=$(./gradlew -q printVersionName | awk -F 'version:' '{printf $2}')" >> $GITHUB_OUTPUT

      - name: Compile version message
        id: embed
        uses: actions/github-script@v8
        with:
          script: |
            const gh = ${{ toJSON(github) }};
            core.setOutput(
              'EMBED_TITLE',
              "[" + gh.event.repository.name + ":" + gh.ref_name + "] new build ${{ steps.version.outputs.VERSION_NAME }}"
            );
            core.setOutput(
              'EMBED_URL',
              `https://github.com/${gh.repository_owner}/${gh.event.repository.name}/packages?version=${{ steps.version.outputs.VERSION_NAME }}`
            );
            core.setOutput('EMBED_AUTHOR_NAME', gh.event.sender.login);
            core.setOutput('EMBED_AUTHOR_ICON_URL', gh.event.sender.avatar_url);

            const commits = ${{ toJSON(github.event.commits) }} || [];
            let description = commits.map(c =>
              `[${c.id.slice(0,7)}](${c.url}) ${c.message} - ${c.author.username}`
            ).join("\n");

            if (!description) {
              const changelogRange = ${{ toJSON(inputs.changelog_range) }};
              description = changelogRange
                ? `Manual run using changelog range ${changelogRange}`
                : `Manual run on ${gh.ref_name}`;
            }

            core.setOutput('EMBED_DESCRIPTION', description);

  publish_github_packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [build, gate]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-jdk${{ env.JAVA_VERSION }}-wrapper${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-

      - uses: actions/download-artifact@v7
        with:
          name: build-libs
          path: .

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish

      - name: Cleanup old GitHub Package versions (keep 2 per MC version)
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const KEEP_PER_MC = 2;
  
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const packageName = `net.p3pp3rf1y.${repo.toLowerCase()}`;
  
            // Versions look like: 1.21.1-1.3.102.1379
            const mcRegex = /^(\d+\.\d+\.(?:\d+|x))-/;
  
            async function listAllVersions() {
              const out = [];
              for (let page = 1; ; page++) {
                const res = await github.request(
                  'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                  {
                    username: owner,
                    package_type: 'maven',
                    package_name: packageName,
                    per_page: 100,
                    page
                  }
                );
                if (!res.data || res.data.length === 0) break;
                out.push(...res.data);
              }
              return out;
            }
  
            function getVersionString(v) {
              if (v.name) return v.name;
              const mvn = v.metadata?.maven;
              if (mvn?.version) return mvn.version;
              return null;
            }
  
            let versions;
            try {
              versions = await listAllVersions();
            } catch (e) {
              core.warning(`Could not list versions for package "${packageName}". Skipping cleanup.`);
              core.warning(String(e.message || e));
              return;
            }
  
            // Group versions by MC version
            const groups = new Map(); // mc -> [{id, created_at, versionString}]
            for (const v of versions) {
              const vs = getVersionString(v);
              if (!vs) continue;
  
              const m = vs.match(mcRegex);
              if (!m) {
                core.info(`Skipping version with unexpected format: ${vs}`);
                continue;
              }
  
              const mc = m[1];
              if (!groups.has(mc)) groups.set(mc, []);
              groups.get(mc).push({
                id: v.id,
                created_at: v.created_at,
                versionString: vs
              });
            }
  
            let totalDeleted = 0;
  
            for (const [mc, arr] of groups.entries()) {
              // newest first; tie-break by id for deterministic ordering
              arr.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at) ||
                (b.id - a.id)
              );
  
              const kept = arr.slice(0, KEEP_PER_MC);
              const toDelete = arr.slice(KEEP_PER_MC);
  
              core.info(
                `MC ${mc}: total=${arr.length}, keeping=${kept.length}, deleting=${toDelete.length}`
              );
  
              for (const ver of toDelete) {
                totalDeleted++;
                core.info(
                  `Deleting [MC ${mc}] version="${ver.versionString}" created_at=${ver.created_at} (id=${ver.id})`
                );
  
                await github.request(
                  'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  {
                    username: owner,
                    package_type: 'maven',
                    package_name: packageName,
                    package_version_id: ver.id
                  }
                );
              }
            }
  
            core.info(`Cleanup complete for "${packageName}". Total versions deleted: ${totalDeleted}`);

  publish_curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: [build, gate]
    if: needs.gate.outputs.should_publish_cf_mr == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-jdk${{ env.JAVA_VERSION }}-wrapper${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-

      - uses: actions/download-artifact@v7
        with:
          name: build-libs
          path: .
      - run: ./gradlew curseforge
        env:
          CHANGELOG_COMMIT_RANGE: ${{ inputs.changelog_range }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  publish_modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest
    needs: [build, gate]
    permissions:
      contents: read
      packages: read
    if: needs.gate.outputs.should_publish_cf_mr == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-jdk${{ env.JAVA_VERSION }}-wrapper${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-

      - uses: actions/download-artifact@v7
        with:
          name: build-libs
          path: .
      - run: ./gradlew modrinth
        env:
          CHANGELOG_COMMIT_RANGE: ${{ inputs.changelog_range }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  code_quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [build, gate]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: zulu

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-jdk${{ env.JAVA_VERSION }}-wrapper${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-branch-${{ needs.gate.outputs.branch_name }}-

      - uses: actions/download-artifact@v7
        with:
          name: build-libs
          path: .
      - name: Run code quality checks
        run: |
          ./gradlew spotlessCheck
          ./gradlew pmdMain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-reports
          path: '**/build/reports/**'
          if-no-files-found: ignore

  discord_notification:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    needs:
      - build
      - publish_github_packages
      - publish_modrinth
      - publish_curseforge
      - code_quality
    if: success()
    steps:
      - uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          embed-title: ${{ needs.build.outputs.embed_title }}
          embed-url: ${{ needs.build.outputs.embed_url }}
          embed-description: ${{ needs.build.outputs.embed_description }}
          embed-author-name: ${{ needs.build.outputs.embed_author_name }}
          embed-author-icon-url: ${{ needs.build.outputs.embed_author_icon_url }}
          embed-color: 58633
